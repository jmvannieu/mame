name: Sync MAME Upstream

on:
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream and Fetch
        run: |
          git remote add upstream https://github.com/mamedev/mame.git
          git fetch upstream --tags

      - name: Get Latest Upstream Tag
        id: get_tag
        run: |
          LATEST_TAG=$(git describe --tags $(git rev-list --tags --max-count=1 upstream/master))
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          echo "Syncing to tag: $LATEST_TAG"

      - name: Merge and Push
        if: success()
        run: |
          git merge ${{ env.LATEST_TAG }} --no-edit -X theirs || MERGE_FAILED=true

          SACRED_FILES=(
            "src/mame/mame.lst"
            "src/frontend/mame/ui/ui.cpp"
            "src/mame/cave/cv1k.cpp"
            ".github/workflows/"
          )

          if [ "$MERGE_FAILED" = true ]; then
            for FILE in "${SACRED_FILES[@]}"; do
              if git ls-files -u | grep -q "$FILE"; then
                echo "!!! REAL CONFLICT IN SACRED FILE: $FILE !!!"
                echo "Manual intervention required. Aborting workflow."
                exit 1
              fi
            done
            
            git add .
            git commit -m "Auto-resolved non-sacred conflicts using Upstream versions"
          fi

          git push origin master --tags
