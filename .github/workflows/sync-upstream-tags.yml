name: Sync MAME Upstream

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream and Fetch
        run: |
          git remote add upstream https://github.com/mamedev/mame.git
          git fetch upstream --tags

      - name: Get Latest Upstream Tag
        id: get_tag
        run: |
          # Finds the most recent tag on the upstream master branch
          LATEST_TAG=$(git describe --tags $(git rev-list --tags --max-count=1 upstream/master))
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          echo "Syncing to tag: $LATEST_TAG"

      - name: Merge and Push
        if: success()
        run: |
          # Merge the tag into your fork's master
          # Since we verified the 3 files haven't changed upstream, this is safe.
          git merge ${{ env.LATEST_TAG }} --no-edit
          git push origin master --tags
